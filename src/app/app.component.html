<mat-toolbar class="om-toolbar" color="primary">
  <span class="om-title">
    <button mat-icon-button (click)="toggleSideNav()">
      <mat-icon>menu</mat-icon>
    </button>
    <span>OM</span>
  </span>

  <span class="om-remaining-space"></span>
  <span>
    <om-user-profile-menu></om-user-profile-menu>
  </span>
</mat-toolbar>

<mat-sidenav-container class="om-sidebar-container">
  <mat-sidenav class="om-sidenav" mode="side" [opened]="opened$ | async">
    <mat-nav-list>
      @for (group of navigationLinks; track group; let isLast = $last) {
        <div>
          @for (item of group; track item.link) {
            <a mat-list-item routerLinkActive="active-link" [routerLink]="item.link">
              {{ item.title }}
            </a>
          }
          @if (!isLast) {
            <mat-divider></mat-divider>
          }
        </div>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="om-sidenav-content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
