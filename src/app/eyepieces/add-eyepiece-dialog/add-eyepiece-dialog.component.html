<h2 mat-dialog-title>Add New Eyepiece</h2>

@if ({ item: item$ | async }; as data) {
  <div mat-dialog-content class="om-add-eyepiece">
    @if (data.item) {
      <div>
        <om-eyepiece [eyepiece]="data.item"></om-eyepiece>
      </div>
    }
  </div>
}

<div mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>

  <button mat-button color="primary" [disabled]="!isValid()" (click)="addItem()">Add</button>
</div>
