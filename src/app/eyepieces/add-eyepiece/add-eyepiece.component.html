@if ({ item: item$ | async }; as data) {
  <div class="om-add-eyepiece">
    <div>
      <h2 class="mat-h2">Add New Eyepiece</h2>
    </div>
    @if (data.item) {
      <div>
        <om-eyepiece [eyepiece]="data.item"></om-eyepiece>
      </div>
    }
    <hr />
    <div>
      <button mat-button color="primary" [disabled]="!isValid()" (click)="addItem()">Add</button>
      <button mat-button (click)="goBack()">Back</button>
    </div>
  </div>
}
