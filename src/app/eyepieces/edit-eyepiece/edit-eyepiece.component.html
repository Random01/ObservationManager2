@if ({ item: item$ | async }; as data) {
  <div
    class="om-edit-eyepiece"
    >
    <div>
      <h2 class="mat-h2">Edit Eyepiece</h2>
    </div>
    @if (data.item) {
      <div>
        <om-eyepiece [eyepiece]="data.item"></om-eyepiece>
      </div>
    }
    <hr/>
    <div>
      <button
        mat-button
        color="primary"
        [disabled]="!isValid()"
      (click)="updateItem()">Update</button>
      <button
        mat-button
      (click)="goBack()">Back</button>
    </div>
  </div>
}
