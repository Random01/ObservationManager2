<h2 mat-dialog-title>Add New Filter</h2>

@if ({ item: item$ | async }; as data) {
  <div
    mat-dialog-content
    class="om-add-scope"
    >
    @if (data.item) {
      <div>
        <om-filter [filter]="data.item"></om-filter>
      </div>
    }
  </div>
}

<div mat-dialog-actions align="end">

  <button
    mat-button
    (click)="cancel()"
    >
    Cancel
  </button>

  <button
    mat-button
    color="primary"
    [disabled]="!isValid()"
    (click)="addItem()"
    >
    Add
  </button>

</div>
