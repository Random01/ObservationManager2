<h2 mat-dialog-title>Add New Lens</h2>

@if ({ item: item$ | async }; as data) {
  <div mat-dialog-content class="om-add-lens">
    @if (data.item) {
      <div>
        <om-lens [lens]="data.item"></om-lens>
      </div>
    }
  </div>
}

<div mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>

  <button mat-button color="primary" [disabled]="!isValid()" (click)="addItem()">Add</button>
</div>
