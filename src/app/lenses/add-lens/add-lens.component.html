@if ({ item: item$ | async }; as data) {
  <div
    class="om-add-lens"
    >
    <div>
      <h2 class="mat-h2">Add New Lens</h2>
    </div>
    @if (data.item) {
      <div>
        <om-lens [lens]="data.item"></om-lens>
      </div>
    }
    <hr/>
    <div>
      <button
        mat-button
        color="primary"
        [disabled]="!isValid()"
        (click)="addItem()"
        >
        Add
      </button>
      <button
        mat-button
        (click)="goBack()"
        >
        Back
      </button>
    </div>
  </div>
}
