@if ({ item: item$ | async }; as data) {
  <div
    class="om-edit-observing-program"
    >
    <div class="header">
      <h2 class="mat-h2">Edit Observing Program</h2>
    </div>
    @if (data.item) {
      <div>
        <om-observing-program [program]="data.item"></om-observing-program>
      </div>
    }
    <hr/>
    <div class="footer">
      <button
        mat-button
        color="primary"
        [disabled]="!isValid()"
      (click)="updateItem()">Update</button>
      <button
        mat-button
      (click)="goBack()">Back</button>
    </div>
  </div>
}
