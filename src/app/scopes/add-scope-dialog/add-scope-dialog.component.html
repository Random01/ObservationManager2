<h2 mat-dialog-title>Add New Scope</h2>

@if ({ item: item$ | async }; as data) {
  <div
    mat-dialog-content
    class="om-add-scope"
    >
    @if (data.item) {
      <om-scope [scope]="data.item"></om-scope>
    }
  </div>
}

<hr/>

<div mat-dialog-actions align="end">

  <button
    mat-button
    (click)="cancel()"
    >
    Cancel
  </button>

  <button
    mat-button
    color="primary"
    [disabled]="!isValid()"
    (click)="addItem()"
    >
    Add
  </button>

</div>
