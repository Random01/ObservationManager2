@if ({ item: item$ | async }; as data) {
  <div class="om-edit-session">
    <div>
      <h2 class="mat-h2">Edit Session</h2>
    </div>
    @if (data.item) {
      <om-session [session]="data.item"></om-session>
    }
    <hr />
    <div>
      <button mat-button color="primary" (click)="updateItem()">Update</button>
      <button mat-button (click)="showObservations()">Show Observation</button>
      <button mat-button (click)="goBack()">Back</button>
    </div>
  </div>
}
