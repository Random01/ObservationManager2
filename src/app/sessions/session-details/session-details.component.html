<div>
  @if (session(); as currentSession) {
    <om-session [session]="currentSession"></om-session>
  }

  <hr />
  <div>
    @if (!editMode) {
      <button mat-button (click)="create()">Create</button>
    }

    @if (editMode) {
      <button mat-button (click)="update()">Update</button>
    }

    @if (editMode) {
      <button mat-button (click)="addNewObservation()">Add New Observation</button>
    }

    <button mat-button routerLink="/sessions">Back</button>
  </div>
</div>
