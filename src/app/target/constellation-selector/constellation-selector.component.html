<div class="om-constellation-selector">
  <mat-form-field>
    <mat-select
      placeholder="Constellation"
      (selectionChange)="onConstellationChange($event.value)"
      >
      <mat-option>None</mat-option>
      @for (constellation of filteredConstellations | async; track constellation) {
        <mat-option
          [value]="constellation"
          >
          {{constellation.name}} ({{constellation.code}})
        </mat-option>
      }
    </mat-select>

  </mat-form-field>
</div>
