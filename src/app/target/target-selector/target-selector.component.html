<div class="om-target-selector">
  <mat-form-field>
    <mat-label>Target</mat-label>
    <input matInput type="text" placeholder="Target" aria-label="Number" [formControl]="searchControl" [matAutocomplete]="auto" (keyup)="search(searchControl.value)" />

    <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn" (optionSelected)="onTargetSelected(searchControl.value)">
      @for (currentTarget of targets$ | async; track currentTarget.id) {
        <mat-option [value]="currentTarget">
          {{ currentTarget.name }}
        </mat-option>
      }
    </mat-autocomplete>

    @if (target()?.id) {
      <button matSuffix mat-icon-button aria-label="Clear" matTooltip="Clear" (click)="clearSelection()">
        <mat-icon>close</mat-icon>
      </button>
    }
  </mat-form-field>

  @if (canAdd()) {
    <button mat-icon-button (click)="openDialog()">
      <mat-icon>add</mat-icon>
    </button>
  }
</div>
